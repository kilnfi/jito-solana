name: Build and upload assets

on:
  release:
    types: [created]


permissions:
  contents: write
  packages: write

jobs:
  output-release:
    runs-on: ubuntu-latest
    name: Ouput release attributes
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set release ID as output
        id: release
        run: |
          echo "release_url=${{ github.event.release.url }}" >> $GITHUB_OUTPUT
          echo "release_name=${{ github.event.release.name }}" >> $GITHUB_OUTPUT
          echo "release_id=${{ github.event.release.id }}" >> $GITHUB_OUTPUT
          echo "release_upload_url=${{ github.event.release.upload_url }}" >> $GITHUB_OUTPUT
          echo "release_assets_url=${{ github.event.release.assets_url }}" >> $GITHUB_OUTPUT

  build-docker:
    runs-on: ubuntu-22.04-16-cores
    needs: output-release
    steps:

    - uses: actions/checkout@v3
      with:
        repository: 'jito-foundation/jito-solana'
        ref: ${{ github.event.release.name }}
        submodules: 'recursive'
        fetch-depth: 0

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Git configuration
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

    - name: Apply Jito-Solana Patches
      run: |
        wget https://gist.githubusercontent.com/t-nelson/9c1af95e0edc2eab39012f325e66738a/raw/42fd988678954a0486494bcc0d610eaf1f68b574/patch.diff
        wget https://gist.githubusercontent.com/t-nelson/9c1af95e0edc2eab39012f325e66738a/raw/c8ac5c46f7640f8d59be1d4b8d9dd13824ffe2b1/patch-2.diff
        
        shasum -a256 patch.diff
        shasum -a 256 patch-2.diff

        git fetch --all
        git checkout v2.1.20-jito
        git rev-parse HEAD
        git am patch.diff
        git am patch-2.diff


    - name: Build
      run: |
        set -x
        CI="" ./sdk/docker-solana/build.sh
        docker tag anzaxyz/agave:"${CI_TAG}" ghcr.io/kilnfi/jito-solana:"${CI_TAG}"
        docker push ghcr.io/kilnfi/jito-solana:"${CI_TAG}"
      env:
        CI_TAG: ${{ github.event.release.name }}
